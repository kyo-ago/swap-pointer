name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Verify .app bundle
        run: |
          BIN_PATH=$(swift build --show-bin-path)/SwapPointer
          APP_DIR="$RUNNER_TEMP/SwapPointer.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"
          cp "$BIN_PATH" "$APP_DIR/MacOS/SwapPointer"
          cp Sources/SwapPointer/Resources/Info.plist "$APP_DIR/Info.plist"
          # Verify bundle structure
          test -f "$APP_DIR/MacOS/SwapPointer"
          test -f "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Info.plist"

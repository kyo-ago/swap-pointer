name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Release
        run: swift build -c release

      - name: Create .app bundle
        id: app
        run: |
          BIN_PATH=$(swift build -c release --show-bin-path)/SwapPointer
          APP_DIR="${{ github.workspace }}/SwapPointer.app"
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"

          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"
          cp "$BIN_PATH" "$MACOS_DIR/SwapPointer"
          cp Sources/SwapPointer/Resources/Info.plist "$CONTENTS_DIR/Info.plist"

          # Update version in Info.plist
          TAG="${{ needs.tagpr.outputs.tag }}"
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$CONTENTS_DIR/Info.plist"

          echo "path=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Codesign
        if: env.DEVELOPER_ID_APPLICATION != ''
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k $KEYCHAIN_PATH -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Sign the .app bundle
          codesign --force --deep --options runtime --sign "$DEVELOPER_ID_APPLICATION" "${{ steps.app.outputs.path }}"

      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Create zip for notarization
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" SwapPointer-notarize.zip
          xcrun notarytool submit SwapPointer-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "${{ steps.app.outputs.path }}"

      - name: Create Release Archive
        run: |
          cd ${{ github.workspace }}
          zip -r SwapPointer-${{ needs.tagpr.outputs.tag }}-macOS.zip SwapPointer.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ needs.tagpr.outputs.tag }}" > /dev/null 2>&1; then
            gh release upload "${{ needs.tagpr.outputs.tag }}" SwapPointer-${{ needs.tagpr.outputs.tag }}-macOS.zip --clobber
          else
            gh release create "${{ needs.tagpr.outputs.tag }}" SwapPointer-${{ needs.tagpr.outputs.tag }}-macOS.zip --generate-notes
          fi
